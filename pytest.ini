# Configuration pytest du TP2.
#
# pythonpath = . : rend le paquet "vulnbank" importable depuis les tests.
# Sans cette ligne, la commande `pytest` echoue avec
# "ModuleNotFoundError: No module named 'vulnbank'" alors que
# `python -m pytest` fonctionne (cette forme ajoute le dossier courant a
# sys.path, la commande `pytest` non). Le pipeline utilise `pytest` : la
# configuration doit donc etre explicite ici, et non dependre de la commande.
[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short
