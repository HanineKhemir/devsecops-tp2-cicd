# =============================================================================
# TP2 — Pipeline CI/CD securise de VulnBank
#
# Le pipeline sert de GARDE-FOU : aucune modification ne peut etre fusionnee
# dans main sans avoir passe quatre portes.
#
#   build-test  compilation + tests unitaires de non-regression de securite
#   sast        Bandit        — failles dans NOTRE code          (analyse statique)
#   sca         pip-audit     — CVE dans NOS DEPENDANCES         (composition)
#   dast        OWASP ZAP     — failles de l'app QUI TOURNE      (analyse dynamique)
#
# Les quatre jobs sont INDEPENDANTS et tournent en parallele. Choix volontaire :
#   - retour plus rapide pour le developpeur (~4 min au lieu de la somme) ;
#   - surtout, une PR vulnerable doit faire apparaitre TOUS ses problemes d'un
#     coup. Si les scanners dependaient de build-test, des tests rouges les
#     empecheraient de tourner et la PR ne montrerait qu'une partie des failles.
#
# Le job final "security-gate" agrege les quatre verdicts : c'est LUI qu'on
# declare "check requis" dans la protection de branche de GitHub.
# =============================================================================
name: CI/CD securise (build, tests, SAST, SCA, DAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permet de relancer le pipeline a la main

# Annule le run precedent si on repousse sur la meme branche (economie de minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE: vulnbank:ci

jobs:
  # ===========================================================================
  # PORTE 1 — Compilation et tests unitaires
  # ===========================================================================
  build-test:
    name: 1. Build & tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v7

      - name: Installation de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilation du code (erreurs de syntaxe)
        run: python -m compileall -q vulnbank tests scripts

      - name: Tests unitaires de non-regression de securite
        run: pytest --junitxml=reports/pytest.xml

      - name: Construction de l'image Docker
        run: docker build -t ${{ env.IMAGE }} .

      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: reports/pytest.xml
          if-no-files-found: ignore

  # ===========================================================================
  # PORTE 2 — SAST : analyse statique du code (outil du TP1 : Bandit)
  # ===========================================================================
  sast:
    name: 2. SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v7

      - name: Installation de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation de Bandit
        run: pip install bandit==1.7.10

      # --exit-zero : Bandit ne decide pas du verdict, il ne fait que rapporter.
      # C'est notre script de porte qui applique la regle de blocage.
      - name: Scan statique du code
        run: |
          mkdir -p reports
          bandit -r vulnbank -f json -o reports/bandit.json --exit-zero
          bandit -r vulnbank -f txt -o reports/bandit.txt --exit-zero || true

      - name: "REGLE DE BLOCAGE : aucune vulnerabilite de severite HIGH"
        run: PYTHONPATH=scripts python scripts/gate_bandit.py reports/bandit.json

      - name: Publication du rapport SAST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-sast-bandit
          path: reports/bandit.*
          if-no-files-found: ignore

  # ===========================================================================
  # PORTE 3 — SCA : securite des dependances (outil du TP1 : pip-audit / OSV)
  # ===========================================================================
  sca:
    name: 3. SCA (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v7

      - name: Installation de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation de pip-audit
        run: pip install pip-audit==2.7.3

      # "|| true" : pip-audit sort en erreur des qu'il trouve une CVE. On veut le
      # rapport complet, puis NOTRE verdict (voir scripts/gate_sca.py).
      - name: Analyse des dependances (base OSV)
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json || true
          pip-audit -r requirements.txt -f columns -o reports/pip-audit.txt || true

      - name: "REGLE DE BLOCAGE : aucune CVE connue dans les dependances"
        run: PYTHONPATH=scripts python scripts/gate_sca.py reports/pip-audit.json

      - name: Publication du rapport SCA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-sca-pip-audit
          path: reports/pip-audit.*
          if-no-files-found: ignore

  # ===========================================================================
  # PORTE 4 — DAST : environnement EPHEMERE + scan actif OWASP ZAP
  #
  # "Ephemere" = l'application est deployee pour le seul temps du scan, dans un
  # reseau Docker prive du runner, puis detruite. Aucune infrastructure
  # permanente a maintenir, et chaque PR est testee sur une instance propre.
  # ===========================================================================
  dast:
    name: 4. DAST (OWASP ZAP sur environnement ephemere)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v7

      - name: Construction de l'image de l'application
        run: docker build -t ${{ env.IMAGE }} .

      # --- Deploiement de l'environnement ephemere -------------------------
      - name: Creation du reseau prive
        run: docker network create zapnet

      - name: Deploiement de l'application
        run: |
          docker run -d --name vulnbank --network zapnet \
            -e HOST=0.0.0.0 \
            -e SECRET_KEY='${{ secrets.CI_SECRET_KEY || github.run_id }}' \
            ${{ env.IMAGE }}

      # On attend la sonde HEALTHCHECK du Dockerfile : scanner une application
      # pas encore demarree donnerait un rapport vide, donc une porte verte
      # a tort (faux negatif).
      - name: Attente du demarrage de l'application
        run: |
          for tentative in $(seq 1 30); do
            etat=$(docker inspect --format='{{.State.Health.Status}}' vulnbank)
            echo "tentative $tentative : etat = $etat"
            if [ "$etat" = "healthy" ]; then
              echo "Application prete."
              exit 0
            fi
            if [ "$etat" = "unhealthy" ]; then
              echo "L'application ne demarre pas."
              docker logs vulnbank
              exit 1
            fi
            sleep 3
          done
          echo "Delai depasse : l'application n'est pas prete."
          docker logs vulnbank
          exit 1

      # --- Scan dynamique --------------------------------------------------
      # zap-full-scan.py = spider + scan ACTIF (ZAP envoie de vraies attaques).
      # Le scan "baseline" (passif) ne produit presque jamais d'alerte High :
      # il ne verrait ni une injection SQL ni un XSS reflechi.
      #   -I : ZAP sort en 0 quoi qu'il trouve (notre script tranche)
      #   -m 2 : 2 minutes maximum pour l'exploration (spider)
      # chmod 777 : le conteneur ZAP tourne sous un autre utilisateur que le
      # runner et doit pouvoir ecrire ses rapports dans reports/.
      - name: Scan dynamique de l'application lancee
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network zapnet \
            -v ${{ github.workspace }}/reports:/zap/wrk:rw \
            -v ${{ github.workspace }}/.zap/rules.tsv:/zap/wrk/rules.tsv:ro \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://vulnbank:5000 \
              -J zap.json -r zap.html -c rules.tsv -I -m 2

      - name: "REGLE DE BLOCAGE : aucune alerte ZAP de risque High"
        run: PYTHONPATH=scripts python3 scripts/gate_zap.py reports/zap.json

      - name: Publication du rapport DAST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-dast-zap
          path: reports/zap.*
          if-no-files-found: ignore

      # --- Destruction de l'environnement ephemere -------------------------
      - name: Journal de l'application et nettoyage
        if: always()
        run: |
          echo "----- journal du conteneur -----"
          docker logs vulnbank || true
          docker rm -f vulnbank || true
          docker network rm zapnet || true

  # ===========================================================================
  # VERDICT GLOBAL — c'est ce job qu'on declare "check requis" sur main
  # ===========================================================================
  security-gate:
    name: Verdict de securite
    runs-on: ubuntu-latest
    needs: [build-test, sast, sca, dast]
    if: always() # doit s'executer meme si une porte a echoue
    steps:
      - name: Agregation des quatre portes
        run: |
          build='${{ needs.build-test.result }}'
          sast='${{ needs.sast.result }}'
          sca='${{ needs.sca.result }}'
          dast='${{ needs.dast.result }}'

          emoji() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "## Verdict de securite"
            echo ""
            echo "| Porte | Outil | Resultat |"
            echo "|---|---|---|"
            echo "| 1. Build & tests | pytest | $(emoji "$build") $build |"
            echo "| 2. SAST | Bandit | $(emoji "$sast") $sast |"
            echo "| 3. SCA | pip-audit / OSV | $(emoji "$sca") $sca |"
            echo "| 4. DAST | OWASP ZAP | $(emoji "$dast") $dast |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$build" = "success" ] && [ "$sast" = "success" ] \
             && [ "$sca" = "success" ] && [ "$dast" = "success" ]; then
            echo "Les quatre portes sont vertes : la fusion est autorisee." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "PIPELINE VERT — fusion autorisee."
            exit 0
          fi

          echo "Au moins une porte est rouge : **fusion bloquee**." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "PIPELINE ROUGE — fusion bloquee. Voir les rapports en artifacts."
          exit 1
